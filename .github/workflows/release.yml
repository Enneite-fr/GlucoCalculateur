# Publication : pousser un tag de version (ex. « v1.1.0 ») construit l'APK et l'AAB signés,
# crée la release GitHub avec l'APK, et garde l'AAB (pour le Play Store) en artefact.
# Secrets à définir une fois (Settings > Secrets and variables > Actions) : voir PUBLICATION.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Vérifier que le tag correspond à versionName
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à versionName ($VERSION_NAME) dans app/build.gradle.kts"
            exit 1
          fi

      - name: Restaurer la clé de signature
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Construire l'APK et l'AAB signés
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GlucoCalculateur-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/GlucoCalculateur-$GITHUB_REF_NAME.aab"

      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Release GitHub (APK)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: AAB pour le Play Store (artefact)
        uses: actions/upload-artifact@v5
        with:
          name: play-store-bundle
          path: dist/*.aab
